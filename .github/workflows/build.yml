name: Build MANGA ARAB APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          flutter config --no-analytics
          flutter create --org com.manga.arab manga_app
          cp -f lib/main.dart manga_app/lib/main.dart
          cd manga_app
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MANGA-ARAB-Ultimate-APK
          path: manga_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
